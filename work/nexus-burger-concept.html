      const state = { scene:'burger', progress:0, selected:'community', member:0, page:0, catalog:false };
      const design = { receipt:'side', accent:'#c92f17' };
      const layers = {
        community:{ title:'NEXUS', food:'上层面包 / OUR PEOPLE', description:'学习、研究、工程。把不同背景的人，夹进同一个好点子里。', categories:[], closed:138, open:22 },

        agent:{ title:'Agent', food:'融化芝士 / AGENTS', description:'连接工具、记忆与任务，让想法开始执行。', categories:['agent'], closed:240, open:250 },
        llm:{ title:'LLM · 后训练', food:'招牌肉饼 / POST-TRAINING', description:'从监督微调、偏好优化，到强化学习与评测。', categories:['posttraining'], closed:253, open:304 },

      };
      const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const resources = key => layers[key].categories.flatMap(category => data.resources[category] || []);
      const total = Object.values(data.resources).reduce((sum, list) => sum + list.length, 0);
      const resourceHtml = item => '<a class="nb-item cursor-interaction" href="' + escape(item.url) + '" target="_blank" rel="noopener noreferrer">' + escape(item.title) + '<small>' + escape(item.source) + '</small></a>';
      function persist(){
        const snapshot = {modelContent:{scene:state.scene,layer:state.selected,progress:state.progress,school:data.schools[state.member].name},privateContent:{...state}};
        if(window.openai && window.openai.setWidgetState) window.openai.setWidgetState(snapshot).catch(() => {});
      }
      function renderLayers(){
        const p = state.progress / 100;
        root.dataset.expanded = p > .57 ? 'true' : 'false';
        root.querySelectorAll('[data-layer]').forEach(button => {
          const key = button.dataset.layer;
          const layer = layers[key];
          button.style.top = (layer.closed + (layer.open - layer.closed) * p) + 'px';
          button.setAttribute('aria-pressed', state.selected === key && p > .57 ? 'true' : 'false');
        });
        find('nb-progress').value = String(state.progress);
        find('nb-progress-label').textContent = state.progress + '%';
      }
      function renderSeats(){
        const start = state.page * 6;
        const group = data.schools.slice(start, start + 6);
        find('nb-seats').innerHTML = group.map((school, i) => {
          const angle = (-90 + i * 360 / group.length) * Math.PI / 180;
          const x = 50 + Math.cos(angle) * 36;
          const y = 50 + Math.sin(angle) * 34;
          return '<button type="button" class="nb-seat cursor-interaction" data-member="' + (start + i) + '" style="left:' + x + '%;top:' + y + '%" aria-label="' + escape(school.name) + '，' + school.count + ' 位伙伴" aria-pressed="' + (state.member === start+i) + '"><div class="nb-person" aria-hidden="true"></div><b>' + escape(school.abbr) + '</b><span>×' + school.count + '</span></button>';
        }).join('');
        find('nb-page').textContent = (start+1) + '–' + Math.min(start+6,data.schools.length) + ' / ' + data.schools.length + ' 所院校';
      }
      function renderMenu(){
        const container = find('nb-menu-content');
        if(state.scene === 'table'){
          const school = data.schools[state.member];
          container.innerHTML = '<div class="nb-eyebrow">同桌伙伴 / ' + escape(school.abbr) + '</div><h3>' + escape(school.name) + '</h3><div class="nb-member-total">' + school.count + '</div><p>位伙伴，相聚 NEXUS。</p><div class="nb-items"><p>学习 · 研究 · 工程</p></div><button type="button" class="nb-action cursor-interaction" data-open-catalog>查看全部院校 →</button>';
          return;
        }
        const layer = layers[state.selected];
        const list = resources(state.selected);
        const intro = state.selected === 'community';
        container.innerHTML = '<div class="nb-eyebrow">' + escape(layer.food) + '</div><h3>' + escape(layer.title) + '</h3><span class="nb-count">' + (intro ? data.schools.length + ' 所院校 · ' + total + ' 项资料' : list.length + ' 项学习资料') + '</span><p>' + escape(layer.description) + '</p><div class="nb-items">' + (intro ? '<p>探索食材，发现技术方向。</p><p>点开一层，读它的学习菜单。</p>' : list.slice(0,2).map(resourceHtml).join('')) + '</div><button type="button" class="nb-action cursor-interaction" ' + (intro ? 'data-expand-burger' : 'data-open-catalog') + '>' + (intro ? '展开汉堡 →' : '完整学习菜单 →') + '</button>';
      }
      function renderCatalog(){
        find('nb-catalog').hidden = !state.catalog;
        if(!state.catalog) return;
        if(state.scene === 'table'){
          find('nb-catalog-title').textContent = '同桌伙伴 · ' + data.schools.length + ' 所院校';
          find('nb-catalog-grid').innerHTML = data.schools.map((school,index) => '<button type="button" class="nb-school-button cursor-interaction" data-member="' + index + '">' + escape(school.name) + '<small>' + escape(school.abbr) + ' · ' + school.count + ' 位伙伴</small></button>').join('');
        }else{
          find('nb-catalog-title').textContent = layers[state.selected].title + ' · 学习菜单';
          find('nb-catalog-grid').innerHTML = resources(state.selected).map(resourceHtml).join('');
        }
      }
      function render(){
        const burger = state.scene === 'burger';
        root.dataset.receipt = design.receipt;
        root.style.setProperty('--nb-red', design.accent);
        root.querySelectorAll('[data-scene]').forEach(button => button.setAttribute('aria-selected',button.dataset.scene === state.scene ? 'true' : 'false'));
        find('nb-main').setAttribute('aria-labelledby',burger ? 'nb-burger-tab' : 'nb-table-tab');
        find('nb-chapter').textContent = burger ? '01 / OUR RECIPE' : '02 / OUR TABLE';
        find('nb-title').textContent = burger ? '好东西，层出不穷。' : '来自各处，坐到一起。';
        find('nb-burger-stage').hidden = !burger;
        find('nb-table-stage').hidden = burger;
        find('nb-burger-controls').hidden = !burger;
        find('nb-table-controls').hidden = burger;
        find('nb-receipt').setAttribute('aria-label',burger ? '食材资料菜单' : '成员院校桌牌');
        renderLayers(); renderSeats(); renderMenu(); renderCatalog();
      }
      function restore(snapshot){
        const previous = snapshot && snapshot.privateContent;
        if(!previous) return;
        if(previous.scene === 'burger' || previous.scene === 'table') state.scene = previous.scene;
        if(Number.isFinite(previous.progress)) state.progress = Math.max(0, Math.min(100, previous.progress));
        if(layers[previous.selected]) state.selected = previous.selected;
        if(Number.isInteger(previous.member) && previous.member >= 0 && previous.member < data.schools.length) state.member = previous.member;
        state.page = Math.floor(state.member / 6);
        state.catalog = previous.catalog === true;
      }
      root.addEventListener('click',event => {
        const button = event.target.closest('button');
        if(!button || !root.contains(button)) return;
        if(button.dataset.scene){state.scene=button.dataset.scene;state.catalog=false;}
        else if(button.dataset.layer){state.selected=button.dataset.layer;state.progress=100;state.catalog=false;}
        else if(button.dataset.progress !== undefined){state.progress=Number(button.dataset.progress);}
        else if(button.dataset.member !== undefined){state.member=Number(button.dataset.member);state.page=Math.floor(state.member/6);}
        else if(button.hasAttribute('data-expand-burger')){state.progress=100;}
        else if(button.hasAttribute('data-open-catalog')){state.catalog=!state.catalog;}
        else if(button.id === 'nb-catalog-close'){state.catalog=false;}
        else if(button.id === 'nb-next' || button.id === 'nb-previous'){
          const pages=Math.ceil(data.schools.length/6);
          state.page=(state.page+(button.id === 'nb-next' ? 1 : -1)+pages)%pages;
          state.member=state.page*6;
        }else{return;}
        root.dataset.dragging='false';
        render();persist();
      });
      find('nb-progress').addEventListener('input',event => {state.progress=Number(event.target.value);root.dataset.dragging='true';renderLayers();});
      find('nb-progress').addEventListener('change',() => {root.dataset.dragging='false';persist();});
      root.querySelector('.nb-tabs').addEventListener('keydown',event => {
        if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
        event.preventDefault();
        const key=event.key === 'Home' ? 'burger' : event.key === 'End' ? 'table' : state.scene === 'burger' ? 'table' : 'burger';
        const tab=root.querySelector('[data-scene="' + key + '"]');
        tab.click();tab.focus();
      });
      window.addEventListener('openai:set_globals',event => {const incoming=event.detail && event.detail.globals && event.detail.globals.widgetState;if(incoming){restore(incoming);render();}});
      restore(window.openai && window.openai.widgetState);
      render();
      if(globalThis.Tweak){
        const tweak=new Tweak({container:find('nb-receipt'),onChange:render});
        tweak.addSelect(design,'receipt',{label:'资料面板',options:[{label:'侧边菜单',value:'side'},{label:'浮动小票',value:'floating'}]});
        tweak.addColorPicker(design,'accent',{label:'强调色',reference:'--nb-red'});
      }
    })();
  </script>
</div>
